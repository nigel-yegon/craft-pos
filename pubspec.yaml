name: craft_pos
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

# ─────────────────────────────────────────────────────────────────────
# RUNTIME DEPENDENCIES
# ─────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  fl_chart: ^0.69.0

  # Local database
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Storage & utils
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.3
  uuid: ^4.6.0
  intl: ^0.20.3
  connectivity_plus: ^6.0.3

  # File & sharing
  csv: ^5.0.2
  share_plus: ^13.3.1
  file_picker: ^13.3.3
  image_picker: ^1.1.2

  # PDF
  pdf: ^3.10.8
  printing: ^5.13.1

  # Networking (for M-Pesa backend API)
  http: ^1.2.0

  # Icon generation
  flutter_launcher_icons: ^0.14.1

# ─────────────────────────────────────────────────────────────────────
# DEV DEPENDENCIES
# ─────────────────────────────────────────────────────────────────────
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

# ─────────────────────────────────────────────────────────────────────
# FLUTTER APP CONFIGURATION
# ─────────────────────────────────────────────────────────────────────
flutter:
  uses-material-design: true

  assets:
    - assets/icon/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_28pt-Regular.ttf
        - asset: assets/fonts/Inter_28pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700

# ─────────────────────────────────────────────────────────────────────
# LAUNCHER ICONS
# ─────────────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true